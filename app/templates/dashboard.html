<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Workload-Konfigurator - Frontend 2</title>
    <style>
        body { font-family: Arial, sans-serif; background: #edf2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        h2 { margin-top: 0; color: #2b6cb0; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #4a5568; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #48bb78; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 25px; font-weight: bold; }
        button:hover { background: #38a169; }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <h2>VM Workload anfragen</h2>
        <form action="/workload" method="POST">
            <label>VM Bezeichnung / Name</label>
            <input type="text" name="vm_name" required placeholder="z.B. Erp-Worker-01">
            
            <label>CPU Kerne</label>
            <select name="cpu">
                <option value="1">1 Core</option>
                <option value="2">2 Cores</option>
                <option value="4">4 Cores</option>
            </select>
            
            <label>Arbeitsspeicher (RAM)</label>
            <select name="ram">
                <option value="1024">1 GB RAM</option>
                <option value="2048">2 GB RAM</option>
                <option value="4096">4 GB RAM</option>
            </select>
            
            <button type="submit">Ressourcen anfordern</button>
        </form>
    </div>
</body>
</html>
