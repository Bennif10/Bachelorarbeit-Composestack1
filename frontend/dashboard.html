<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #1e293b;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #16a34a;
        }

        .card {
            margin-top: 20px;
            padding: 15px;
            background: #334155;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    Dashboard
</div>

<div class="container">

    <h3>Workload erstellen</h3>

    <input id="vm_name" placeholder="VM Name">
    <input id="cpu" placeholder="CPU">
    <input id="ram" placeholder="RAM">

    <button onclick="createWorkload()">Erstellen</button>

    <div class="card" id="output">
        Noch keine Daten
    </div>
</div>

<script>
async function createWorkload() {
    const vm_name = document.getElementById("vm_name").value;
    const cpu = document.getElementById("cpu").value;
    const ram = document.getElementById("ram").value;

    const res = await fetch("http://10.1.90.123/workload", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            vm_name,
            cpu: Number(cpu),
            ram: Number(ram)
        })
    });

    const data = await res.json();

    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
