services:

  fastapi:
    build: ./app
    container_name: fastapi
    ports:
      - "80:80"
    environment:
      DATABASE_USERS_URL: postgresql://user:password@10.1.90.121:5432/users_db
      DATABASE_DATA_URL: postgresql://user:password@10.1.90.122:5432/frontend_data_db
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: docker_frontend

    ports:
      - "8080:80"

    depends_on:
      - fastapi

    networks:
      - app_network

    restart: unless-stopped

networks:
  app_network:
    driver: bridge